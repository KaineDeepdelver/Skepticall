name: Keep Render awake

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        # Long timeout on purpose: a sleeping Spring Boot service can take
        # about a minute to wake up.
        run: curl -fsS --max-time 90 "https://skepticall.onrender.com/ping" || echo "ping failed"
